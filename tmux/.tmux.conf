# ~/.tmux.conf
# A reasonable, modern starting config. Sections are grouped by purpose so
# it's easy to find and tweak things as you learn what you actually want.

# ---- Prefix key -------------------------------------------------------
# Ctrl-b is a two-hand stretch; Ctrl-a is a single easy reach and matches
# GNU screen muscle memory. This does shadow readline's "start of line"
# binding inside a pane, but you rarely need that right after hitting prefix.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- General sane defaults ---------------------------------------------
set -g mouse on                 # click to switch panes/windows, drag to resize, scroll to scroll back
set -sg escape-time 0           # no delay after hitting Esc (matters for vim/nvim inside tmux)
set -g base-index 1             # windows start at 1, not 0 (0 and 1 are awkward to reach together)
setw -g pane-base-index 1       # same for panes
set -g renumber-windows on      # closing window 2 of 3 shifts window 3 down to fill the gap
set -g history-limit 10000      # bigger scrollback than the 2000-line default
set -g focus-events on          # lets apps like vim detect focus in/out (e.g. autoread)

# True color support. Most modern terminals (iTerm2, Ghostty, Alacritty, kitty,
# Terminal.app as of recent macOS) advertise this correctly if TERM is set right.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"


# ---- Keybindings ---------------------------------------------------------
# Reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# More intuitive split bindings, and open new panes/windows in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix + h/j/k/l instead of arrow keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L (repeatable, holding the key works)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable extended key support
set -s extended-keys on
set -as terminal-features 'xterm-256color:extkeys'

# Bind Shift+Enter to send the newline escape sequence
bind-key -n S-Enter send-keys Escape "[13;2u"

# ---- Copy mode -----------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Mouse drag-to-select: with `mouse on`, dragging inside a pane auto-enters
# copy mode. Override tmux's default drag-end (which only copies to tmux's
# internal buffer) so releasing the mouse also pipes the selection to pbcopy
# and exits copy mode, matching the `y` binding above.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ---- Plugins (managed by TPM) --------------------------------------------
# Prefix + I installs, Prefix + U updates, Prefix + alt+u removes unlisted plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # small grab-bag of well-agreed-upon tmux defaults
set -g @plugin 'dracula/tmux'                 # the theme
# resurrect must load before continuum — continuum calls resurrect's save/restore scripts.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Dracula theme options — kept intentionally minimal to start.
# Full option list: https://github.com/dracula/tmux
set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-flags true
set -g @dracula-military-time true
set -g @dracula-show-left-icon session

# ---- Session persistence (resurrect + continuum) -------------------------
# Also save what's actually on screen in each pane (not full scrollback),
# so a restored shell pane isn't just an empty prompt.
set -g @resurrect-capture-pane-contents 'on'
# Use vim/nvim's own :mksession mechanism on save/restore instead of just
# relaunching a bare editor — restores open buffers, splits, cursor position.
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# continuum: autosave every 15 min, auto-restore when a tmux server starts,
# and auto-launch tmux at login (installs a macOS LaunchAgent) so a saved
# session is there even after a full reboot without you typing `tmux` first.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'   # launch iTerm2 (not Terminal.app) at login

# Keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
